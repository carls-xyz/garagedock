<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votre garage en ligne</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <h1>Votre garage en ligne</h1>
  <div id="etat" class="etat ko">Etat actuel de la base : ...</div>
  <p class="conteneur">Cette page est servie par le  : <strong id="conteneur">...</strong></p>

  <h2>Vos rendez-vous prévus</h2>
  <table>
    <thead><tr><th>Jour</th><th>Créneau</th><th>Véhicule</th><th>Prestation</th></tr></thead>
    <tbody id="liste"><tr><td colspan="4">Chargement...</td></tr></tbody>
  </table>

  <h2>Réserver un créneau</h2>
  <form id="formulaire">
    <input name="salle" placeholder="Véhicule (ex. Clio IV - AB-123-CD)" required>
    <input name="jour" type="date" required>
    <input name="creneau" placeholder="Créneau (ex. 08:30 - 10:00)" required>
    <input name="motif" placeholder="Prestation (ex. Vidange, pneus, freins)" required>
    <button type="submit">Réserver le rendez-vous</button>
  </form>
  <p id="message"></p>

  <script>
    async function rafraichir() {
      const sante = await fetch("/api/sante").then((r) => r.json());
      const etat = document.getElementById("etat");
      etat.textContent = "Base : " + sante.base;
      etat.className = "etat " + (sante.base === "connectée" ? "ok" : "ko");
      document.getElementById("conteneur").textContent = sante.conteneur;

      const liste = document.getElementById("liste");
      const reponse = await fetch("/api/reservations");
      if (!reponse.ok) {
        liste.innerHTML = '<tr><td colspan="4">Pas de base de données : aucun rendez-vous à afficher pour l\'instant.</td></tr>';
        return;
      }
      const reservations = await reponse.json();
      liste.innerHTML = "";
      if (reservations.length === 0) {
        liste.innerHTML = '<tr><td colspan="4">Aucun rendez-vous pour le moment.</td></tr>';
        return;
      }
      for (const r of reservations) {
        const ligne = document.createElement("tr");
        for (const valeur of [r.jour, r.creneau, r.salle, r.motif]) {
          const cellule = document.createElement("td");
          cellule.textContent = valeur;
          ligne.appendChild(cellule);
        }
        liste.appendChild(ligne);
      }
    }

    document.getElementById("formulaire").addEventListener("submit", async (e) => {
      e.preventDefault();
      const donnees = Object.fromEntries(new FormData(e.target));
      const reponse = await fetch("/api/reservations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(donnees),
      });
      const message = document.getElementById("message");
      if (reponse.ok) {
        message.textContent = "";
        e.target.reset();
      } else {
        const erreur = await reponse.json();
        message.textContent = "Impossible d'enregistrer le rendez-vous : " + erreur.erreur;
      }
      rafraichir();
    });

    rafraichir();
    setInterval(rafraichir, 3000);
  </script>
</body>
</html>
